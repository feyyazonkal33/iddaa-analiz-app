<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b132b">
    <meta name="description" content="İddaa Analiz Progressive Web App">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Feyz Analiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Main List View -->
        <div id="main-view" class="view active">
            <!-- Header -->
            <header class="app-header">
                <div class="logo-area">
                    <i class="fa-solid fa-chart-line logo-icon" style="color:#ffcc00; margin-right:8px;"></i>
                    <h1 class="app-title">Feyz Analiz</h1>
                </div>
                <div class="header-actions">
                    <button class="live-btn" aria-label="Canlı Maçlar">
                        <span class="live-dot"></span>
                        CANLI
                    </button>
                    <button class="icon-btn settings-btn" aria-label="Ayarlar">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Navigation Controls -->
            <div class="nav-controls">
                <!-- Date Tabs -->
                <div class="date-tabs">
                    <button class="date-tab" data-date-filter="yesterday">Dün</button>
                    <button class="date-tab active" data-date-filter="today">Bugün</button>
                    <button class="date-tab" data-date-filter="tomorrow">Yarın</button>
                    <button class="date-tab" data-date-filter="all">Tümü</button>
                </div>

                <!-- Search Input -->
                <div class="search-box">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="match-search" placeholder="Takım veya maç ara..." aria-label="Takım veya maç ara">
                </div>
            </div>

            <!-- Content Area -->
            <main class="matches-content">
                <div id="status-message" class="status-message hidden"></div>

                <!-- Süper Lig Section -->
                <section class="league-section" id="league-super-league" data-league="Süper Lig">
                    <div class="league-header">
                        <div class="league-header-left">
                            <span class="league-flag">🇹🇷</span>
                            <h2 class="league-title">Süper Lig</h2>
                        </div>
                        <button class="standings-btn" data-league-id="203" data-league-name="Süper Lig">
                            📊 Puan Durumu
                        </button>
                    </div>
                    <div class="match-list" id="super-league-list">
                        <!-- Dynamic match cards loaded here -->
                    </div>
                </section>

                <!-- Bundesliga Section -->
                <section class="league-section" id="league-bundesliga" data-league="Bundesliga">
                    <div class="league-header">
                        <div class="league-header-left">
                            <span class="league-flag">🇩🇪</span>
                            <h2 class="league-title">Bundesliga</h2>
                        </div>
                        <button class="standings-btn" data-league-id="78" data-league-name="Bundesliga">
                            📊 Puan Durumu
                        </button>
                    </div>
                    <div class="match-list" id="bundesliga-list">
                        <!-- Dynamic match cards loaded here -->
                    </div>
                </section>
            </main>
        </div>

        <!-- Match Detail View -->
        <div id="detail-view" class="view hidden">
            <header class="app-header detail-header">
                <button id="back-btn" class="back-btn" aria-label="Geri Dön">
                    ← Geri
                </button>
                <h1 class="app-title">Maç Detayı</h1>
                <div style="width: 40px;"></div> <!-- spacer for header balance -->
            </header>
            <main class="detail-content">
                <div class="detail-banner-card">
                    <div class="detail-league-tag" id="detail-league-tag">Süper Lig</div>
                    <div id="detail-teams-headline" class="detail-headline">
                        <div class="team-block home-block">
                            <span id="detail-home-team" class="detail-team-name">Ev Sahibi</span>
                        </div>
                        <span class="vs-badge">VS</span>
                        <div class="team-block away-block">
                            <span id="detail-away-team" class="detail-team-name">Deplasman</span>
                        </div>
                    </div>
                    <div class="detail-meta">
                        <span id="detail-match-time">--:--</span>
                        <span class="bullet-dot">•</span>
                        <span id="detail-match-date">--.--.----</span>
                    </div>
                </div>

                <div id="detail-markets" class="detail-markets-container">
                    <!-- Dynamic markets loaded here -->
                </div>
            </main>
        </div>

        <!-- Standings Modal View -->
        <div id="standings-view" class="view hidden">
            <header class="app-header standings-header">
                <button id="standings-back-btn" class="back-btn" aria-label="Geri Dön">
                    ← Geri
                </button>
                <h1 class="app-title" id="standings-title">Puan Durumu</h1>
                <div style="width: 40px;"></div>
            </header>
            <main class="standings-content">
                <div id="standings-status" class="status-message hidden"></div>
                <div class="standings-table-container">
                    <table class="standings-table">
                        <thead>
                            <tr>
                                <th class="col-rank">#</th>
                                <th class="col-team">Takım</th>
                                <th class="col-num">O</th>
                                <th class="col-num">G</th>
                                <th class="col-num">B</th>
                                <th class="col-num">M</th>
                                <th class="col-num">AV</th>
                                <th class="col-num">P</th>
                            </tr>
                        </thead>
                        <tbody id="standings-tbody">
                            <!-- Dynamic standings rows loaded here -->
                        </tbody>
                    </table>
                </div>
            </main>
        </div>

        <!-- Settings View / Modal -->
        <div id="settings-view" class="view hidden">
            <header class="app-header settings-header">
                <button id="settings-back-btn" class="back-btn" aria-label="Geri Dön / Kapat">
                    ← Geri
                </button>
                <h1 class="app-title">Ayarlar</h1>
                <div style="width: 40px;"></div> <!-- spacer for header balance -->
            </header>
            <main class="settings-content">
                <div class="settings-card">
                    <h2 class="settings-card-title">API Ayarları</h2>
                    <div class="form-group">
                        <label for="api-key-input" class="form-label">The Odds API Key</label>
                        <div class="input-with-button">
                            <input type="text" id="api-key-input" class="form-input" placeholder="API Key giriniz..." autocomplete="off">
                            <button id="save-api-key-btn" class="btn btn-primary">Kaydet</button>
                        </div>
                        <span id="api-key-status" class="form-help-text hidden"></span>
                    </div>
                    <div class="form-group" style="margin-top: 12px;">
                        <label for="football-api-key-input" class="form-label">API-Football Key</label>
                        <div class="input-with-button">
                            <input type="text" id="football-api-key-input" class="form-input" placeholder="API-Football Key giriniz..." autocomplete="off">
                            <button id="save-football-api-key-btn" class="btn btn-primary">Kaydet</button>
                        </div>
                        <span id="football-api-key-status" class="form-help-text hidden"></span>
                    </div>
                </div>

                <div class="settings-card">
                    <h2 class="settings-card-title">Veri Yönetimi</h2>
                    <button id="refresh-data-btn" class="btn btn-secondary full-width">
                        🔄 Verileri Yenile
                    </button>
                </div>

                <div class="settings-footer">
                    <span class="version-tag">v1.0</span>
                </div>
            </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
